- {id: M1, text: "A flow of records (identified, removed before screening, screened, excluded with reasons, assessed in full text, included) is reported with counts at every stage, the counts add up, and the included count matches the k analyzed in the same unit", adjudication: paper}
- {id: M2, text: "The search can be repeated: the databases and other sources, the search strings, the date range or the date the search ended, and any hand searching, reference chasing, or calls for unpublished work", adjudication: paper}
- {id: M3, text: "Unpublished work (dissertations, working papers, conference papers, data from authors) was sought, and published and unpublished effect sizes are compared, or the paper explains why neither was possible", adjudication: paper}
- {id: M4, text: "Inclusion and exclusion criteria are stated as rules set before coding; more than one person screened or coded, or a second person checked the coding, and agreement is reported (one overall figure, or agreement on effect size and N, is enough); the paper says whether it coded only hypothesized effects or all reported ones, and states how effect directions were aligned", adjudication: paper}
- {id: M5, text: "Every effect size conversion is documented and uses the right formula and degrees of freedom; regression coefficients, standardized betas, and partial correlations are not pooled with zero-order correlations without a stated method and a result with them removed; and effect sizes measured at different levels of analysis are not pooled without a level moderator or a stated reason", adjudication: paper}
- {id: M6, text: "For the included studies that carry the most weight, the coded sample size and data source, and the coded effect size where the primary study reports the same statistic, match what the primary study reports", adjudication: external}
- {id: M7, text: "No sample enters twice: articles that reuse the same data set, survey wave, or panel are identified and treated as one sample; in a second-order or umbrella review, primary studies shared by the included meta-analyses are identified", adjudication: external}
- {id: M8, text: "Dependent effect sizes (several from one sample or study) are handled by averaging, one per sample, a multilevel or multivariate model, or robust variance estimation, and k, standard errors, and tests reflect independent samples, not effect sizes", adjudication: paper}
- {id: M9, text: "The model (fixed, random, or mixed effects), the between-study variance estimator, and the tradition (Hunter-Schmidt psychometric or Hedges-Olkin) are stated, statistics from the two traditions are labeled where they are mixed, and the inference matches the model: a fixed-effect result is not generalized beyond the studies included", adjudication: paper}
- {id: M10, text: "Heterogeneity is reported as tau (or tau-squared, or SD rho) on the effect size scale with a prediction or credibility interval; I-squared and Q are not read as the range of true effects, and any claim that the effect holds across settings fits that interval", adjudication: paper}
- {id: M11, text: "Corrections for measurement error or range restriction state each input and where it came from (the same measure and population), use the direct or indirect range restriction model that fits, report corrected and uncorrected estimates side by side, and say what reliability means for any firm-level archival measure they correct", adjudication: paper}
- {id: M12, text: "Outliers and influential studies are examined with a stated rule or influence diagnostics suited to the model, and the main estimate is reported with and without them and without any single study that carries a large share of the weight", adjudication: paper}
- {id: M13, text: "A MASEM states its pooling method (univariate, two-stage, or one-stage), the sample size used to fit the model and why, the number of studies and total N behind each cell of the pooled matrix, the missing cells, and heterogeneity, and does not read fit statistics as if they came from one sample", adjudication: paper}
- {id: M14, text: "Publication bias and selective reporting are assessed with more than one method and read with their caveats: fail-safe N alone does not count, funnel asymmetry is not equated with publication bias, a trim-and-fill estimate under heterogeneity is not read as the true effect, and the paper notes when its tests assume independent effect sizes that are not independent", adjudication: paper}
- {id: M15, text: "Moderators are tested in a model with residual heterogeneity (mixed-effects meta-regression, or a test of the difference between subgroups), with the k in each subgroup, attention to moderators that move together, and a correction or caveat for the number of tests, and moderator and boundary-condition claims rest on those tests", adjudication: paper}
- {id: M16, text: "Causal, mechanism, and mediation claims fit the design: pooled correlations from observational studies, study-level moderators, and meta-analytic mediation are described as associations unless the primary designs were coded and the claim rests on the designs that support it", adjudication: judgment}
- {id: M17, text: "The size of the pooled effect is described against a benchmark suited to the field or in substantive units, not by Cohen's small, medium, and large labels", adjudication: judgment}
- {id: M18, text: "The coded data set (effect sizes, sample sizes, moderator codes), the coding manual, and the analysis code are available, or the paper says why not", adjudication: paper}
