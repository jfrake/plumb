name: network
overlay: true
detection_cues:
  - "network centrality, betweenness, eigenvector centrality, closeness, network position, structural holes, constraint, effective size, efficiency, brokerage, closure, embeddedness"
  - "alliance network, SDC Platinum, MERIT-CATI, co-patenting, co-inventor, co-authorship network, board interlock, interlocking directorates, syndication, co-investment, syndicate partners, VentureXpert, Preqin, BoardEx"
  - "dyad, dyadic, firm pairs, partner selection, tie formation, link formation, network formation, tie dissolution, tie persistence, triadic closure, preferential attachment"
  - "ERGM, exponential random graph, TERGM, SAOM, SIENA, RSiena, stochastic actor-oriented, QAP, MRQAP, relational event model, latent space"
  - "peer effects, social influence, contagion, diffusion through ties, spillover through partners, imitation of tied partners, learning from partners, homophily"
  - "sociometric, name generator, roster, whole-network survey, ego network, egocentric, informant, advice network, communication network, email network"
  - "small world, small-world quotient, clustering coefficient, path length, core-periphery, network community"
  - "structural signals: a unit of analysis that is a pair or a firm-year built from ties; a trailing window applied to ties; an adjacency matrix; UCINET, igraph, statnet, sna, ergm, RSiena, btergm, Pajek; a two-mode source projected to one mode; a dyad-level table with errors clustered by firm; a response-rate footnote for a network survey; an inventor or firm-name disambiguation step"
slots:
  verify: [network-numbers.md]
  diagnose: [network-measurement.md, network-inference.md]
turns_off: []
core_notes:
  face-validity.md:
    - {text: "Read the `Network variables:` line in `{WORKSPACE}/stage-0/fingerprint.md`, as corrected in `{WORKSPACE}/brief.md` (section 'User corrections'). For each network variable listed there, Step 7 also asks whether the kind of tie measured can carry what the mechanism says flows through it (for example, whether an announced alliance, a shared director, or a co-patent carries knowledge, trust, or information), and whether the tie window fits how long that flow lasts. Leave to the network pack the window's statement and robustness, the network boundary, missing ties, and the size-dependence of brokerage measures."}
  completeness.md:
    - {text: "Do not flag a missing network boundary statement, tie window, match rate for actor identification, handling of missing ties, or whole-network model diagnostics; the network pack owns them."}
  packs/archival/agents/methods-checks.md:
    - {text: "Read the `Network design:` line in `{WORKSPACE}/stage-0/fingerprint.md`, as corrected in `{WORKSPACE}/brief.md` (section 'User corrections'). Leave to the network pack, in CHECK 5 and CHECK 7b, the standard errors of models whose unit is a pair of actors or a directed tie (dependence among pairs that share an actor), except when the treatment or key regressor varies at the level of an actor or above (for example a firm-level, country-level, region-level, or industry-level treatment); then CHECK 5 applies, counting clusters at that level. Leave to the network pack the estimation diagnostics and inference of ERGM, TERGM, SAOM, relational event, latent space, and QAP models; CHECK 6 and CHECK 7 stay yours for those models. In ERGM, TERGM, SAOM, relational event, and latent space models, terms computed from the network being modeled (triangles, shared partners, reciprocity, degree terms) are how the model represents dependence; do not treat them as measurement tautology, bad controls, or reverse causality."}
  packs/archival/agents/adversarial-dgp.md:
    - {text: "Read the `Network design:` and `Network variables:` lines in `{WORKSPACE}/stage-0/fingerprint.md`, as corrected in `{WORKSPACE}/brief.md` (section 'User corrections'). Do not raise selection into ties, homophily, or shared environment as alternatives to spread through ties; the network pack's G13 owns them. When network position is a main treatment, include among your alternatives the forces that produce position: prior status, prior ties, shared educational or employment affiliations, and traits that also drive the outcome. In ERGM, TERGM, SAOM, relational event, and latent space models, terms computed from the network being modeled (triangles, shared partners, reciprocity, degree terms) are how the model represents dependence; do not treat them as measurement tautology, bad controls, or reverse causality."}
  packs/archival/agents/design-checks.md:
    - {text: "When an instrument is built from network structure (for example, characteristics of friends of friends, or partners' lagged centrality), leave to the network pack's G13 whether the paper argues that network is exogenous to the outcome. Keep instrument strength, weak-instrument inference, and every other exclusion question (IV1, IV2, IV5, IV15)."}
  packs/inference/agents/inference-dependence.md:
    - {text: "Read the `Network design:` line in `{WORKSPACE}/stage-0/fingerprint.md`, as corrected in `{WORKSPACE}/brief.md` (section 'User corrections'). When it lists dyadic ties, then for each model whose unit is a pair of actors or a directed tie, skip I3, I5, and I8, and skip I1 except when the treatment or key regressor varies at the level of an actor or above (for example a firm-level, country-level, region-level, or industry-level treatment); then I1 and I4 apply, counting clusters and treated groups at that level, and in I1 do not raise dependence among pairs that share an actor, which G10 owns; the network pack's G10 owns dependence among pairs that share an actor, and this extends the exclusion for dependence among dyads in your instructions to those checks. I7, I9, and I10 still apply to those models. When it lists a whole-network model, skip each ERGM, TERGM, SAOM, relational event, latent space, or QAP model in every check; the network pack's G10 and G12 own their inference. Under I8, units connected through ties (alliance partners, interlocked boards) are among the units that can share shocks."}
  packs/inference/agents/inference-claims.md:
    - {text: "In I12, leave to the network pack (check G10) a result that depends on how the standard errors of a model whose unit is a pair of actors or a directed tie treat dependence among pairs that share an actor. Keep every other analytic path, and keep I11 and I13 to I16 for those models."}
  packs/nonlinear/agents/nonlinear-numbers.md:
    - {text: "In a tie-formation model with sampled non-ties, the sample mean of the outcome is not the base rate; make no odds_ratio record unless the paper reports the population rate."}
  packs/nonlinear/agents/nonlinear-claims.md:
    - {text: "In a tie-formation model with sampled non-ties, ask for predicted outcomes on the probability scale only after reweighting or a prior correction; the network pack's G11 owns the sampling. In N9, do not read an odds ratio at the sample mean of a sample with sampled non-ties."}
read_checkin_lines: ["Network design:", "Network variables:"]
severity_rules:
  - "G13 wording test. The claim is causal when the abstract, the hypotheses, or the conclusions use causal verbs for spread (causes, leads to, influences, learns from, spreads to, imitates because). A paper that uses associational wording throughout ('is associated with', 'consistent with') gets no G13 finding. A paper whose abstract or conclusion is causal while the results section hedges gets 'Weakens a claim' at most, and the fix is wording."
  - "G13 design. When the claim is causal, is the main claim, the paper is theory testing, and the design has no strategy that separates spread from selection, such as those G13 lists, the finding is 'Undermines the main claim'. When the design uses one of them and a gap remains, or the claim is not the main claim, it is 'Weakens a claim'. Causal wording on a secondary result whose design the paper otherwise treats as associational is 'Minor'."
  - "G13 reflection. A linear-in-means coefficient that the main claim reads as an endogenous peer effect, with no identification argument, is 'Undermines the main claim'. The same with an argument that the paper does not defend against the correlated-effects reading is 'Weakens a claim'."
  - "For a phenomenon-driven paper, lower each G13 finding by one level. The Stage 4 compiler applies this rule once; the network agents never apply it."
  - "G10. Errors that do not meet G10 (default, heteroskedasticity-robust only, clustered by dyad only, or clustered on one member only) in a model that tests any hypothesis are 'Weakens a claim'. The finding is 'Undermines the main claim' only when the model tests the headline hypothesis and the paper's own estimate with errors that meet G10 is not significant at the level the text uses for the headline. Two-way clustering on the two members' identities in one-mode dyads is 'Minor'."
  - "G12. When the paper's own reported convergence statistics fail the criteria the paper or its software documentation states, for a parameter that carries a hypothesis, the finding is 'Undermines the main claim' if that hypothesis is the headline one and 'Weakens a claim' otherwise. Missing diagnostics are 'Weakens a claim' for the model that carries the main claim and 'Minor' for a robustness model."
  - "G1. A descriptive network statistic that the paper's own counts cannot produce is a number flag at the Stage 1 check-in, not a major issue, unless the same number enters a model; then it is 'Weakens a claim'."
  - "A finding on a network statistic that carries no hypothesis is 'Minor'."
  - "A missing statement (no boundary, no window, no match rate) is 'Minor' when the choice is a common convention the paper cites, even when the variable it affects carries the main claim, and 'Weakens a claim' when that variable carries the main claim and the paper cites no such precedent."
  - "G3. No alternative window, with a conventional window stated, is 'Minor'. It is 'Weakens a claim' when the paper keeps ties active past end dates it says the source records, or when the variable carries the main claim and the window is unconventional or unstated."
  - "Every other network finding is capped at 'Weakens a claim'."
