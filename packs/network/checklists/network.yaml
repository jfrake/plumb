- {id: G1, text: "Descriptive network statistics agree with the counts they come from when the paper states both for the same network: density with the numbers of actors and ties, mean degree with ties per actor, and the number of dyads with the actors, periods, and sampling described", adjudication: paper}
- {id: G2, text: "The network boundary (which actors and which kinds of tie are included) is stated, and the set of actors used to compute each network measure matches the population the hypotheses describe; ties to actors outside the sample are either included in the measure or the omission is stated and its effect considered; actors with no ties in the window are included or excluded by a stated rule, and a sample restricted to actors with ties is noted as conditioning on tie formation; closeness, path length, and small-world statistics state how unreachable pairs in a disconnected network are handled", adjudication: paper}
- {id: G3, text: "What counts as a tie, when it starts, and when it ends are stated; the time window or decay rule is stated, ties the data record as ended are not kept active without a stated reason, and the main result is shown under at least one other window or decay rule", adjudication: paper}
- {id: G4, text: "Missing actors and ties are quantified: for survey data, the response rate and the shares of pairs in which both members, and at least one member, responded; for archival data, the coverage limits of the source; the handling of missing actors and ties is stated; and, for survey data, and for archival data where the paper's own description shows the coverage gap bears on the measure, the main network measures are shown to be robust to plausible missingness", adjudication: paper}
- {id: G6, text: "How actors are identified across records (inventor disambiguation, firm names, parents and subsidiaries, mergers, director identity) is described, with a match rate or error rate or a bound on it", adjudication: paper}
- {id: G7, text: "When ties come from shared affiliations (boards, patents, deals, papers) projected to one mode, the paper says so, and it does not read clustering, transitivity, density, or small-world statistics of the projection as evidence of closure or cohesion without a baseline that keeps the affiliation structure or a measure defined on the two-mode data", adjudication: paper}
- {id: G8, text: "For network data collected by survey, the name generator and any cap on the number of contacts are stated; ego-network measures built from respondent-reported ties among contacts are described as such and not read as position in the whole network; and the rule that turns one or two reports into a tie (either reports, both report) is stated, with results under the other rule when reciprocity or tie-level results are claimed", adjudication: paper}
- {id: G9, text: "When constraint, effective size, efficiency, or a centrality score other than degree is a main or moderating variable, the model includes the actor's number of contacts (degree or ego-network size) or the paper reports the correlation and shows the result is not an effect of having more ties", adjudication: paper}
- {id: G10, text: "In any model whose unit is a dyad or a directed tie, inference allows for correlation among all dyads that share an actor, in either position (dyadic-robust standard errors, a permutation test such as QAP, or a model of the dependence); clustering on one member of the pair, or by dyad alone, does not meet this; when no actor can appear in both positions (two-mode dyads such as investor and startup), two-way clustering on the two members meets it", adjudication: paper}
- {id: G11, text: "In a tie-formation model, the set of pairs at risk of forming a tie is defined and defended; when non-ties are sampled, the sampling ratio is reported and the estimates are reweighted or corrected, or the paper does not interpret the intercept, predicted probabilities, or baseline rates; and actor-level propensity to form ties is handled for both members of the pair (actor fixed effects, or degree or activity controls for both)", adjudication: paper}
- {id: G12, text: "When the paper estimates an ERGM, TERGM, SAOM, relational event, or latent space model: for simulation-based estimates (MCMC maximum likelihood for ERGM and TERGM, SAOM method of moments, Bayesian latent space), it reports convergence for every parameter against the software's stated criteria and checks for degeneracy where the model family is prone to it; for pseudo-likelihood estimates, it states the bootstrap used; for every ERGM, TERGM, and SAOM, it reports goodness of fit on network statistics not included in the model; QAP results state which permutation method was used", adjudication: paper}
- {id: G13, text: "A claim that an outcome spreads through ties (influence, contagion, imitation, learning from partners) rests on a design that separates spread from selection on similar traits, shared environment, and the partner choice itself (randomized ties or treatments, an outside shock to ties, a dynamic model of selection and influence, identification from network structure (peers of peers who are not peers; Bramoulle, Djebbari, and Fortin 2009), or placebo outcomes and timing tests); otherwise the wording is associational; a regression of an actor's outcome on the contemporaneous mean outcome of its peers or group is read as an endogenous peer effect only with a stated identification argument, and is separated from the effects of peers' characteristics and of shared conditions", adjudication: judgment}
- {id: G15, text: "When network position is a main predictor of performance and no archival adversarial agent runs, the paper names what produces the position (prior status, prior ties, shared affiliations, the traits that also drive the outcome) and its design addresses those; instruments for position are judged by the IV checks, not here", adjudication: judgment}
- {id: G16, text: "Network measures are computed from ties formed before the outcome is measured; when the window for the measure overlaps the outcome period, the paper says so and shows a specification without the overlap; tie formation and tie persistence are not pooled when the claim concerns only one", adjudication: paper}
