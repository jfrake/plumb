- {id: R1, text: "Each event's date is the first public disclosure of the news, the source of the dates is named, the paper says how it looked for earlier reports, leaks, or rumors, and announcements made after the market close or on a non-trading day are assigned to the next trading day, or the window includes it", adjudication: paper}
- {id: R2, text: "For a study of about ten or fewer events, or for an event the paper discusses by name, no public report of the same news appeared before the date the paper uses", adjudication: external}
- {id: R3, text: "The return model (market-adjusted, market model, or a named factor model), the market index and its weighting, the estimation window's length and its gap before the event, the minimum number of returns required, the return data source, and the software or code are reported; the estimation window ends before the event window begins", adjudication: paper}
- {id: R4, text: "In a multi-country sample, the benchmark allows for world as well as home-market movements and trading calendars are aligned before returns are cumulated; where many stocks trade thinly, the paper screens them out or adjusts for it", adjudication: judgment}
- {id: R5, text: "The main event window is short, named before the results, and justified by when the news reached the market; results for the other windows the paper computed are reported; a hypothesis stated for one window is not declared supported by a different window", adjudication: judgment}
- {id: R6, text: "The CAR over a window before the event is reported, and anticipation or leakage is discussed where the news was likely expected or leaked before the announcement", adjudication: paper}
- {id: R7, text: "The confounding-event screen is stated: which kinds of news, over which days, from which source, and how many events it removed; the main result is shown with and without the removed events", adjudication: paper}
- {id: R8, text: "For a study of about ten or fewer events, or for an event the paper discusses by name, no earnings release, dividend change, merger news, or executive change of the same firm falls inside the event window without being screened out or discussed", adjudication: external}
- {id: R9, text: "When events share announcement dates (many firms reacting to one regulation, ruling, or election, several events on one day, or repeat events of one firm with overlapping windows), the paper reports at least one test that allows for cross-sectional correlation of abnormal returns (such as the Kolari and Pynnonen adjustment, or a portfolio or calendar-time approach), and it does not rest the result only on tests that assume abnormal returns are independent across events", adjudication: paper}
- {id: R10, text: "The reported numbers for each abnormal-return test cohere: a statistic the paper identifies as the cross-sectional t matches the mean CAR, its standard deviation or standard error, and N; its stars and p-values match it; a window's mean CAR equals the sum of the daily mean abnormal returns or sub-window CARs it contains when they are computed on the same events and extreme values are handled before summing; the share of positive CARs is possible with the stated N; and the sample counts reconcile from raw events to the final sample", adjudication: paper}
- {id: R11, text: "The median CAR and the share of positive CARs are reported beside the mean with a test that does not rest on the mean alone (a sign or rank test), the rule for extreme returns (winsorizing level, trimming, or none) is stated and applied the same way throughout, and the main result is shown with and without it; a result resting only on the Patell test, where the event plausibly raises return variance, is supported by a test robust to event-induced variance (BMP or the cross-sectional t)", adjudication: paper}
- {id: R12, text: "Each test states its number of events; tests on small subgroups are not read as support without an argument about precision; a study of one firm or a few events does not rest its inference on a standard test of the event-window return against estimation-window residuals", adjudication: judgment}
- {id: R13, text: "A short-window CAR is read as the market's revised expectation at the announcement, relative to what investors already anticipated; claims about long-run value creation, realized performance, or stakeholder welfare rest on more than that window; a null CAR is not read as \"investors do not value\" the action when the event was likely anticipated; and a pooled mean over events whose news runs in opposite directions is not read as no reaction", adjudication: judgment}
- {id: R14, text: "When returns are measured over months or years, the paper uses buy-and-hold returns against carefully built reference portfolios or matched firms, or calendar-time portfolios, addresses dependence from overlapping windows, and does not present a long-window CAR tested as if the windows were independent", adjudication: paper}
- {id: R15, text: "Regressions with a CAR as the dependent variable use standard errors that allow for unequal return variance across firms, and, when events share announcement dates, for correlation among them; the paper says which it uses", adjudication: paper}
- {id: R16, text: "Controls in a CAR regression are measured before the event; terms revealed at or after the announcement (deal terms, post-announcement analyst actions, later financials) are not used as controls when the paper claims the effect of an earlier trait", adjudication: judgment}
- {id: R17, text: "When the main claim reads a trait's coefficient in a CAR regression as the market's causal valuation of that trait, the paper addresses why firms with the trait chose to announce; a Heckman correction has a first-stage variable excluded from the second stage, and the significance of the inverse Mills ratio is not read as proof that selection is present or absent", adjudication: judgment}
- {id: R18, text: "The population of events is defined (which firms, which kinds of announcement, which years), and every screen from raw events to the final sample (listing, return data, minimum estimation-window returns, confounding events) is stated with its count", adjudication: paper}
