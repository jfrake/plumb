- {id: F1, text: "The introduction makes one move that a reader can name in a sentence (a root in notes/chords.md), and the abstract and introduction make the same move", adjudication: judgment}
- {id: F2, text: "The root is carried: the introduction names the theory or belief at stake and says what it gets wrong, cannot explain, or wrongly limits; that a topic is unstudied, or that a process has not been opened up, does not carry a root by itself", adjudication: judgment}
- {id: F3, text: "The foil is named and fair: the specific claim, explanation, or assumption the paper moves against, and the work that holds it, stated as that work holds it rather than overdrawn; an introduction that calls a problem unsolved acknowledges the main answers already offered and says why they fall short", adjudication: judgment}
- {id: F4, text: "How the introduction portrays prior work, and how hard it pushes, fit the root and the evidence: a paper that says it overturns a literature shows that literature is wrong; a paper that joins scattered streams says why joining them changes a prediction", adjudication: judgment}
- {id: F5, text: "When the introduction promises a reversal, it states what readers believe and what the paper shows instead, and the findings deliver that reversal", adjudication: paper}
- {id: F6, text: "The root suits the design: a hidden anomaly found in the paper's own data rests on data that show it; a head-to-head has a design whose predictions tell the rivals apart; a shaky foundation supplies evidence that fixes what was wrong with the old evidence; a rival account makes at least one prediction the accepted account does not", adjudication: judgment}
- {id: F7, text: "The paper delivers what its introduction promises: the findings support the claim the introduction makes (who or what acts, at what level, with what effect), not only the same kind of move, and the discussion and stated contributions make that claim at least as strongly", adjudication: paper}
