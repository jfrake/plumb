# How published introductions frame their contribution: a hunch about what papers like this one do,
# never a rule. Built from 1,000 research articles in seven journals, 2010-2025 (Organization Science 180,
# ASQ, AMJ, SMJ and OBHDP 143 each, AMR 142, Management Science 106 from its Organizations and Strategy
# departments), each introduction coded once by a model (Oct 10, 2026) with ten roots, the two rarest since
# merged into the eight in notes/codebook.md. A human check of 30 codes found them sound. Numbers are
# percentages of the group's n; rests_on is the share of introductions that only gesture at their root, by
# the weak frame they rest on. Aggregate counts only: no text from any paper.
# Built by framing/scripts/build_norms.py, outside this repository.

overall:
  n: 1000
  carried: 33
  roots: {"standing anomaly": 6, "hidden anomaly": 8, "rival account": 5, "shaky foundation": 7, "theory repair": 26, "wider reach": 36, "head-to-head": 7, "dissolved debate": 5}
  rests_on: {"unstudied topic": 88, "process for its own sake": 9, "literature-only puzzle": 3, "no stated claim": 0}
  voicing: {"cumulative / adds": 34, "scattered / adds": 29, "cumulative / completes": 15, "contested / adds": 10, "scattered / completes": 7, "contested / completes": 3, "contested / overturns": 2, "cumulative / overturns": 1, "scattered / overturns": 0}

