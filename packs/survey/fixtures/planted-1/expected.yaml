# Every firm, person, country, and cited scale in planted.pdf is fictional (Kestrel Freight, Norvalia,
# the authors, and the scales of Harlow and Venn 2009, Marisco and Delorne 2012, Randell and Okafor 2011,
# Tolland 2006, Quenby and Asare 2015, Dranfield 2010). Only the methods references are real.
# A reference check will not find the six fictional scale sources; that is expected and is not a planted error.
status: pending_planting
owner: blind-agent
synthetic: true
label: "SYNTHETIC TEST PAPER, NOT REAL RESEARCH"
paper: planted.pdf
matrix_checked: true
must_catch:
  - {check: S2, page: 8, locator: "Results, common method variance: The first factor explained 31.4 percent of the variance, so common method bias is not a concern", note: "P1: Harman's test offered as proof of no common method bias; voice is supervisor-rated", severity: "Minor"}
  - {check: S4, page: 3, locator: "Method, research setting and design: We used a three-wave, time-lagged design", note: "P2: 'three-wave' design with two waves in the timing table (Table 1, page 3). The locator sentence also says the mediator and the outcome were collected at different times, though both are wave 2.", severity: "Weakens a claim"}
  - {check: S7, page: 5, locator: "Measures, voice: We averaged the ten items into a single voice score", note: "P3: ten-item voice composite (alpha .91), with alpha read as showing one scale, while the appendix factor analysis (Table A1, page 11: Two factors had eigenvalues above 1) shows promotive and prohibitive factors", severity: "Weakens a claim"}
  - {check: S8, page: 7, locator: "Results, measurement model and discriminant validity: The six-factor measurement model showed good fit", note: "P4: CFI .89, RMSEA .09, SRMR .09 called good fit against the paper's own cutoffs .95, .06, .08 (Hu and Bentler 1999)", severity: "Weakens a claim"}
  - {check: S9, page: 6, locator: "Table 2, row 2 (Team trust), column 1 (Psychological safety): All VIFs were below 5 (the largest was 3.31, for team trust)", note: "P5: r .83 with alphas .82 and .80, disattenuated lower bound 1.012; both in the mediation model; only VIFs offered. The pair check reads the printed alpha as the paper presents it; alpha is item-level and is not the reliability of the team mean (ICC(2), unreported).", severity: "Undermines the main claim"}
  - {check: S10, page: 4, locator: "Method, sample and procedure: yielding a usable response rate of 34.3 percent", note: "P6: 34.3 percent is returned over invited, not usable; rate offered as evidence of no bias (This exceeds the 30 percent commonly accepted in organizational research, so nonresponse bias is unlikely); wave-2 loss (412 to 318) not compared with those retained, although HR records cover the whole frame", severity: "Weakens a claim"}
  - {check: S13, page: 4, locator: "Method, measures, psychological safety: we averaged the ratings of all wave 1 respondents in each team and assigned the team mean to each member", note: "P7: team mean with no agreement or reliability indices; individual-level OLS with OLS standard errors and no clustering by team (page 5: We tested the hypotheses with ordinary least squares). When inference runs, credit the clustering half under inference I1; the survey S13 finding then covers only the missing rwg, ICC(1) and ICC(2) and stays Weakens because it concerns the main predictor.", severity: "Weakens a claim"}
  - {check: S16, page: 6, locator: "Results, hypothesis tests, controls: tenure reduces voice", note: "P8: wave-2 job satisfaction entered as a control (page 4: we include job satisfaction as a control variable in all models); tenure coefficient read as a finding", severity: "Weakens a claim"}
  - {check: S17, page: 6, locator: "Results, H2: Team trust fully mediates the effect, because the direct effect became nonsignificant once team trust entered the model", note: "P9: full mediation from a nonsignificant direct effect; mediator (team trust) and outcome (voice) both measured at wave 2; mediator not assigned and no causal assumptions stated; mechanism is a stated contribution", severity: "Weakens a claim"}
must_not_flag:
  - {check: S1, page: 5, locator: "Method, common method variance: this separation of source and time is our remedy for common method bias", note: "D1: supervisor-rated voice at wave 2 against employee-rated safety at wave 1; the separation is named as the remedy; the employee-to-employee path (safety to trust) is also given a named remedy (six-month lag, team mean)"}
  - {check: S9, page: 7, locator: "Table 2, row 7 (Leader openness), column 6 (Voice climate): The constrained model fit significantly worse", note: "D2: r .52 with reliabilities .88 and .85, disattenuated about .601, nested-model comparison (delta chi-square 151.4 on 1 df) and latent correlation .60 with its interval reported"}
  - {check: S16, page: 5, locator: "Method, control variables: We control for team size", note: "D3: team size from HR records at wave 1 with a stated reason; results with and without controls in Appendix Table A2 (page 12)"}
also_fair:
  - {check: S14, page: 2, locator: "Theory and hypotheses, H1: Team psychological safety increases employee voice", note: "Causal hypothesis wording in a two-wave observational survey with no argument about confounding (for example, supervisor behavior shaping both safety and ratings of voice); prescriptive implication on page 9 (should build psychological safety in their teams). Not planted, but a fair flag."}
  - {check: S16, page: 9, locator: "Discussion, practical implications: who in our data spoke up less", note: "Same error as P8 at a second location: the tenure control coefficient becomes a practical implication. Credit a flag here as S16."}
  - {check: S17, page: 8, locator: "Discussion, theoretical implications: Our second and main contribution is to identify team trust as the mechanism", note: "Same error as P9 at a second location: the mechanism claim restated as the main contribution without the same-wave or unassigned-mediator caveat. Credit a flag here as S17."}
  - {check: S6, page: 4, locator: "Method, measures: The full wording of every item is in the online supplement", note: "The cited scales are fictional, so an external provenance check cannot find them. A note that the sources could not be verified is expected from the core reference check or from scale-provenance's not-found line, not from S6; a claim that the measures deviate from their sources is not fair."}
  - {check: S13, page: 6, locator: "Table 2: Psychological safety is the team mean assigned to each member", note: "The diagonal prints item-level alpha for a team mean; the reliability of a group mean is ICC(2). An r of .83 between a team mean and an individual rating implies at least 69 percent of team-trust variance lies between teams. Fair flag; overlaps P5 and P7."}
  - {check: S14, page: 9, locator: "Discussion, practical implications: should build psychological safety in their teams", note: "Prescription from the causal H1; same issue as the p. 2 entry, second location."}
  - {check: S17, page: 5, locator: "Method, analysis: We followed the causal-steps logic of Baron and Kenny (1986) to classify the form of mediation", note: "Sets up the full-mediation reading in P9; credit as S17."}
