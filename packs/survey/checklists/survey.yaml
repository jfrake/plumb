- {id: S1, text: "For each hypothesized main or mediated relation whose predictor and outcome come from the same respondent, the paper names the method-bias risk and what the design does about it (a separate source, a time lag, a different response format, anonymity); a statistical test is not offered in place of a design remedy", adjudication: paper}
- {id: S2, text: "A single-factor test (a first unrotated factor explaining under half the variance, or a one-factor model fitting worse than the measurement model) is not offered as evidence that common method bias is absent", adjudication: paper}
- {id: S3, text: "A marker variable or latent method factor comes with its rationale (the marker is theoretically unrelated to the substantive constructs and shares their method), its results are reported, and the technique is not presented as proof that bias is absent", adjudication: judgment}
- {id: S4, text: "The design the paper names (longitudinal, time-lagged, multi-wave, multi-source) matches the wave and source of each focal variable as the methods section reports them", adjudication: paper}
- {id: S5, text: "Every focal multi-item measure reports its source, its items or where to find them, its response scale, and any change from the original; ad hoc scales and single-item measures of latent constructs come with a validity argument", adjudication: paper}
- {id: S6, text: "The measures match their cited sources in item count, dimensions, and response format, or the paper discloses and justifies each change", adjudication: external}
- {id: S7, text: "Reliability is reported for every multi-item reflective scale; a composite is not scored as one scale when the paper's own factor analysis shows more than one factor, and reliability is not offered as evidence of unidimensionality or validity", adjudication: paper}
- {id: S8, text: "Measurement-model fit is reported with more than one index, and the paper's reading of fit matches its own numbers and the cutoffs it cites; a comparison of means or paths across groups reports a test of measurement invariance", adjudication: paper}
- {id: S9, text: "Highly correlated focal constructs are shown to be distinct with a test that can detect their overlap (a disattenuated correlation with its interval, or a nested-model comparison); a variance inflation factor or the Fornell-Larcker rule alone does not settle it, and a disattenuated correlation at or above 1 is addressed", adjudication: paper}
- {id: S10, text: "The sampling frame, contacts, responses, usable responses, and response rate are reported and add up; nonresponse is assessed against what is known about nonrespondents or the population where the frame allows; a response rate, or a benchmark rate, is not offered as evidence of no bias; for multi-wave designs, the count at each wave is reported and those lost between waves are compared with those retained on earlier measures", adjudication: paper}
- {id: S11, text: "For crowdsourced or opt-in panel samples, the paper reports the platform, collection dates, how eligibility for the claimed population was verified, quality screens, exclusions by reason, and, for data collected in 2023 or later, what guards against automated or LLM-generated responses", adjudication: paper}
- {id: S12, text: "Firm- or unit-level constructs reported by one informant come with the informant's position and basis of knowledge, and a second source for the outcome or a stated reason why none exists", adjudication: judgment}
- {id: S13, text: "Constructs aggregated from individual responses report within-group agreement and reliability with a reason for aggregating, and the analysis models or clusters the nesting", adjudication: paper}
- {id: S14, text: "Causal wording (effect, increases, drives, leads to) and prescriptive implications match what the design can show; a limitations sentence on cross-sectional data does not stand in for an argument about direction and confounding when the hypotheses and implications are causal", adjudication: paper}
- {id: S15, text: "When the paper offers a remedy for endogeneity (lags, added controls, a selection model, an instrument, a lagged dependent variable), the remedy fits the threat it names: controls or lags are not called a solution to endogeneity; a selection model names its exclusion variable; an instrument comes with an exclusion argument and first-stage strength", adjudication: paper}
- {id: S16, text: "Each control has a stated reason, is measured before or with the predictor (by wave, where waves exist), and is not plausibly a result of the predictor; results are shown with and without controls; control coefficients are not interpreted as findings", adjudication: paper}
- {id: S17, text: "A mediation claim tests the indirect effect itself, says the mediator was not assigned and what must hold for a causal reading, is not called full mediation because the direct effect lost significance, and treats measurement of the mediator in the same wave as the predictor or the outcome as a limit on the claim", adjudication: paper}
- {id: S18, text: "The printed correlation matrix is one that complete data could produce within rounding, or the paper says the correlations use pairwise deletion", adjudication: paper}
