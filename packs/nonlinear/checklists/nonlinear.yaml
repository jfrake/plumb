- {id: N1, text: "A U-shaped or inverted-U claim is tested in the range of the data: the turning point implied by the reported coefficients lies inside the observed range of the variable, on the scale the model uses; the slopes at the low and high ends of that range have opposite signs and each is distinguishable from zero (or an equivalent test such as two lines or the Lind and Mehlum test is reported); the turning point is reported with an interval (a Fieller interval when the squared term is imprecise); and the text claims no rise, fall, or interior optimum that the reported slopes and range do not show", adjudication: paper}
- {id: N2, text: "A moderated curve is specified and shown for what the hypothesis claims (a shifted turning point, a flatter or steeper curve, or both), with curves plotted at low and high moderator values inside the moderator's range, and a change of shape across that range is checked", adjudication: judgment}
- {id: N3, text: "A product term in a linear model comes with all its constitutive terms, and each lower-order coefficient is read as the effect where the other variable equals zero, a value that lies inside that variable's observed range. A lower-order term absorbed by the model's fixed effects counts as included", adjudication: paper}
- {id: N4, text: "Moderation is shown as the conditional effect across the moderator with intervals, not only as the product-term coefficient, and the moderator values plotted or tested (such as the mean plus or minus one standard deviation, or a Johnson-Neyman region) lie inside the moderator's observed range where the data have observations", adjudication: paper}
- {id: N5, text: "Mean-centering is not presented as a remedy for multicollinearity, and multicollinearity is not used to explain away a weak interaction", adjudication: paper}
- {id: N6, text: "A claim that an effect differs across groups, periods, or subsamples rests on a test of the difference (a pooled interaction or a test of equal coefficients), not on one estimate being significant and the other not", adjudication: paper}
- {id: N7, text: "When a squared term sits in a model with unit fixed effects, the curve is read as within-unit, and no unit-level optimum is drawn from the pooled range of levels", adjudication: judgment}
- {id: N8, text: "In a logit, probit, count, or hazard model, an interaction or squared term is judged on the scale the hypothesis names (probability, count, rate, hazard, or survival): the paper states the scale and reports second differences, cross-partial effects, or predicted outcomes across the moderator with intervals, and does not rest the claim on the sign and significance of the coefficient alone", adjudication: paper}
- {id: N9, text: "Odds ratios, incidence rate ratios, and hazard ratios are described correctly (an odds ratio is not a ratio of probabilities), and logit or probit coefficients are not compared across models or groups as if they shared a scale", adjudication: paper}
- {id: N10, text: "When an outcome with many zeros enters as log(1+y), log(y+c), or the inverse hyperbolic sine, the share of zeros is reported, the coefficient is not read as a percentage change or elasticity without support, and the result is shown robust to the units of y or replaced by an estimate with a clear scale (Poisson or PPML, a two-part model, or separate extensive and intensive margins)", adjudication: paper}
- {id: N11, text: "A three-way interaction includes all lower-order two-way and main-effect terms, and the pattern the hypothesis states is tested with simple slopes and tests of slope differences at stated moderator values, not only by the sign of the triple product. A lower-order term absorbed by the model's fixed effects counts as included", adjudication: paper}
- {id: N12, text: "The functional form a nonlinear claim rests on is checked with a flexible alternative (bins, splines, two lines, or a binning or kernel interaction estimator); an interaction between correlated variables is checked against the squared terms of each, and a curve against the interaction", adjudication: judgment}
- {id: N13, text: "The size of each nonlinear effect the paper claims is stated in the outcome's units over a meaningful change in the variable, at stated moderator values, with its uncertainty", adjudication: paper}
