name: experiments
detection_cues:
  - random assignment to conditions
  - laboratory experiment
  - field experiment
  - survey or vignette experiment
  - conjoint experiment
  - manipulation check
slots:
  context: [sample-and-materials.md]
  theory: [mechanism-isolation.md]
  diagnose: [methods-checks.md, alternative-explanations.md, cross-study-consistency.md]
turns_off:
  - {agent: timeline-research.md, reason: the treatment was assigned at random by a stated procedure}
read_checkin_lines: ["Designs:"]
severity_rules:
  - "For theory-testing papers, a manipulation confounded with another construct that could produce the main effect by itself is 'Undermines the main claim'."
  - "A measured mediator meets the field's standard. A mechanism claim is weakened only when a specific, plausible rival would move the same mediator and the paper does not address it. Then it is 'Weakens a claim' if the mechanism is central, and 'Minor' otherwise."
  - "An underpowered focal study is 'Weakens a claim' unless it is the paper's only evidence for the main claim."
  - "For phenomenon-driven papers, demands for mechanism isolation are downgraded one level."
  - "Exclusions of participants on a measure the treatment could affect (a check or attention item placed after the manipulation, completion time, take-up or compliance, or a per-protocol sample): no finding when the paper reports the estimate without the exclusion, on everyone assigned who has an outcome, and that estimate supports the claim. 'Minor' when counts by condition are reported and similar and that estimate is not shown. 'Weakens a claim' when counts by condition are missing or differ. 'Undermines the main claim' only when the counts differ, the study carries the main claim, and that estimate is absent. Dropout that leaves outcomes missing is 'Minor' when counts by condition are reported and similar, and 'Weakens a claim' when they are missing or differ and the paper reports no bounds or sensitivity analysis for the missing outcomes. A study carries the main claim when the main hypothesis rests on it and no other study in the paper supports the same hypothesis free of the same problem."
  - "For an encouragement design (`Designs:` lists `IV (encouragement)`), the archival IV module's checks this pack runs (IV1, IV2, IV3, IV4, IV5, IV9, IV11) are 'Undermines the main claim' only for IV1 with IV2 in the cases the module states, and only when the instrumented estimate carries the main claim; every other finding on them is at most 'Weakens a claim'. The intention-to-treat estimate of the outcome on assignment is a randomized comparison and is never judged as conditioning on a post-treatment variable."
  - "The experiments methods agent's automatic high-severity patterns (its CHECK 12b) are 'Undermines the main claim' only when the study carries the main claim (as the exclusions rule defines it) and the pattern bears on the main hypothesis; an undisclosed deviation from the registration is 'Undermines the main claim' only when, in addition, the registered primary outcome is not reported or does not support the claim. Otherwise each is 'Weakens a claim'."
core_notes:
  packs/inference/agents/inference-claims.md:
    - text: "For tests of a randomized comparison (differences in condition means, ANOVA and t tests of conditions, regressions of an outcome on the assigned condition), the experiments pack checks that each printed test statistic matches its p-value, the size of each key effect, and nulls and differences across studies or conditions: skip I15 and I16 for them, and in I13 leave a printed statistic that does not match its p-value to that pack. Keep I12, I14, and I13's reading of significance wording and one-tailed tests for them."
  packs/inference/agents/inference-dependence.md:
    - text: "For a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them), skip I4 as well as I3 and I9; the experiments pack's methods agent owns the number of treated clusters. Keep I1 for randomized comparisons (the experiments pack leaves the clustering level to you), and keep every check for estimates from variation not assigned that way."
  packs/archival/agents/methods-checks.md:
    - text: "Estimates from a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them) belong to the experiments pack: apply your checks only to estimates from variation not assigned that way, and skip the vignette-experiment bullet in CHECK 9."
  packs/archival/agents/adversarial-dgp.md:
    - text: "Rivals to a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them) belong to the experiments pack's alternative-explanations agent: build alternatives only for findings from variation not assigned that way."
  packs/archival/agents/mechanism-discrimination.md:
    - text: "The process evidence for a result from a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them) is judged by the experiments pack's mechanism-isolation agent: analyze only results from variation not assigned that way."
  packs/archival/agents/triangulation.md:
    - text: "Tensions within or between studies that rest on a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them) belong to the experiments pack's cross-study-consistency agent: keep tensions that involve a result from variation not assigned that way."
  packs/survey/agents/claims-and-controls.md:
    - text: "Apply S14 to S16 only to studies whose predictor was measured, not assigned, whatever the order of the packs in `run.json` `packs`; the experiments pack checks causal wording, remedies, and controls for studies that assign a treatment."
  packs/survey/agents/psychometrics.md:
    - text: "For the outcome and mediator scales in a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them), skip S5, S6, and S7, whatever the order of the packs in `run.json` `packs`: the experiments pack's methods agent checks the outcome and mediator scales of randomized studies (its CHECK 4 [E9] and CHECK 9 [E13]). Keep S5 to S7 for moderator and covariate scales, and for any study in the paper that assigns no treatment that way."
  packs/survey/agents/respondents-and-sources.md:
    - text: "For the outcome and mediator scales in a randomized comparison (a treatment assigned at random by a stated procedure, by the researchers or an organization working with them), skip S1, whatever the order of the packs in `run.json` `packs`: the experiments pack's methods agent checks the outcome and mediator of randomized studies, including a mediator measured from the same respondent as the outcome (its CHECK 4 [E9] and CHECK 9 [E13]). Keep S1 for any study in the paper that assigns no treatment that way."
  packs/experiments/agents/methods-checks.md:
    - text: "Plumb uses no cutoff it cannot source. In CHECK 1, CHECK 2, CHECK 10, and CHECK 12b, state the concern without the numbers 'fewer than about 30-50' clusters, 'more than about 5 percentage points' of attrition, 'more than about 10-15 tasks' per participant, and 't between 2.0 and 2.5'. In CHECK 10, ask instead whether the paper checks how responses change across task order. The wrong-level pattern in CHECK 12b applies only when the paper's own numbers show that the headline test does not hold with errors clustered at, or a model of, the level of assignment."
    - text: "Rate exclusions and dropout on a measure the treatment could affect by this pack's severity rule on exclusions, quoted here: Exclusions of participants on a measure the treatment could affect (a check or attention item placed after the manipulation, completion time, take-up or compliance, or a per-protocol sample): no finding when the paper reports the estimate without the exclusion, on everyone assigned who has an outcome, and that estimate supports the claim. 'Minor' when counts by condition are reported and similar and that estimate is not shown. 'Weakens a claim' when counts by condition are missing or differ. 'Undermines the main claim' only when the counts differ, the study carries the main claim, and that estimate is absent. Dropout that leaves outcomes missing is 'Minor' when counts by condition are reported and similar, and 'Weakens a claim' when they are missing or differ and the paper reports no bounds or sensitivity analysis for the missing outcomes. A study carries the main claim when the main hypothesis rests on it and no other study in the paper supports the same hypothesis free of the same problem. Write the rule's level in your Severity line as Low for 'Minor', Moderate for 'Weakens a claim', and High only for 'Undermines the main claim'. Do not use the second automatic pattern of CHECK 12b for them, and use the attrition line of CHECK 2, without its number, only for dropout that leaves outcomes missing. Take-up or compliance, and a per-protocol sample, are measures the treatment could affect. A degrees-of-freedom gap that implies unreported exclusions is its own E2 finding. This rule governs every exclusion on a measure the treatment could affect, whatever the first automatic pattern of CHECK 12b says."
    - text: "Rate every automatic high-severity pattern of CHECK 12b by this pack's severity rule on those patterns, quoted here: The experiments methods agent's automatic high-severity patterns (its CHECK 12b) are 'Undermines the main claim' only when the study carries the main claim (as the exclusions rule defines it) and the pattern bears on the main hypothesis; an undisclosed deviation from the registration is 'Undermines the main claim' only when, in addition, the registered primary outcome is not reported or does not support the claim. Otherwise each is 'Weakens a claim'. Write the rule's level in your Severity line as Low for 'Minor', Moderate for 'Weakens a claim', and High only for 'Undermines the main claim'."
    - text: "In CHECK 6, compute every p-value you compare and show the command: run `python3 -c` with `{PLUGIN}/skills/review/scripts` on the import path and `import pvalues`. For t(df), use `pvalues.p_student(t, df)`; for F(df1, df2), use `pvalues._betai(df2 / 2, df1 / 2, df2 / (df2 + df1 * F))`; for chi-square with 1 df, use `pvalues.p_normal(chi2 ** 0.5)`. Compute at the printed statistic plus and minus half a unit of its last digit. Do not recompute other statistics; list them as not recomputed. Read a printed p with `pvalues.printed_p_range`, so 'p = .000' means below .0005. Flag a mismatch only when no statistic the printed digits allow gives the printed p, and a change in the significance conclusion only for a mismatch that crosses the threshold the paper uses; 'p = .05' for a computed .052 is consistent. Read a test as one-tailed only when the paper says so. When the printed p matches half the two-sided p for a statistic the printed digits allow and the paper declares no tails, record an undeclared one-tailed test under E6, at most 'Weakens a claim' and never an automatic high-severity pattern; when `inference` is in `run.json` `overlays`, leave it to that pack's I13. Error degrees of freedom equal analyzed N minus cells only in a between-subjects design with no covariates: subtract one for each covariate, and infer no N from degrees of freedom in a within-subjects or mixed design. If you compute a standardized difference for balance, compute it with the pooled SD, with the square root of the summed variances, and with the control group's SD, and call an imbalance large only if it is large under all three."
    - text: "In CHECK 8, when the paper reproduces its registration in an appendix or supplement, compare the paper with that copy as well as with any registration you fetch; a registration link that does not resolve is a reporting gap, not a deviation. Never copy author names, affiliations, or emails from a registration into any file."
    - text: "In CHECK 13, a stated fact about the participant platform or panel that `stage-2/sample_and_materials.md` shows is wrong is checklist item E10; cite it."
    - text: "Encouragement designs. Read `Designs:` in `{WORKSPACE}/stage-0/fingerprint.md` as corrected in `{WORKSPACE}/brief.md` (section 'User corrections'). When it lists `IV (encouragement)`, read `{PLUGIN}/packs/archival/modules/iv.md` and run only IV1, IV2, IV3, IV4, IV5 (the channel argument only: assignment affecting outcomes other than through uptake), IV9, and IV11 on each instrumented estimate a hypothesis rests on, citing those ids, under this pack's severity rule for encouragement designs. If the file is missing, say so in the Methods Summary and skip these checks. The archival design-checks agent does not run them. That rule reads: For an encouragement design (`Designs:` lists `IV (encouragement)`), the archival IV module's checks this pack runs (IV1, IV2, IV3, IV4, IV5, IV9, IV11) are 'Undermines the main claim' only for IV1 with IV2 in the cases the module states, and only when the instrumented estimate carries the main claim; every other finding on them is at most 'Weakens a claim'. The intention-to-treat estimate of the outcome on assignment is a randomized comparison and is never judged as conditioning on a post-treatment variable. Write the rule's level in your Severity line as Low for 'Minor', Moderate for 'Weakens a claim', and High only for 'Undermines the main claim'."
    - text: "Apply this note only when `inference` is in `run.json` `overlays`. In CHECK 1, leave whether the analysis clusters at, or models, the level of assignment to the inference pack (its I1); keep the number of clusters and the small-cluster correction, which that pack leaves to you. In CHECK 12b, do not use the wrong-level pattern; the inference pack's rules set that severity."
    - text: "Apply this note only when `survey` is in `run.json` `packs`. For a study that assigns no treatment at random, leave mediation (CHECK 9), causal wording and scope (CHECK 13), and the quality of an online or panel sample to the survey pack (its S11 and S14 to S17); run your checks on the studies that assign a treatment."
    - text: "Apply this note only when `nonlinear` is in `run.json` `overlays`. For each term listed under `Nonlinear terms:` in `{WORKSPACE}/stage-0/fingerprint.md`, leave the probing of the interaction (the last bullet of CHECK 6) and the size of its effect (CHECK 14) to the nonlinear pack; keep every other check on it."
    - text: "In CHECK 3, a missing manipulation check is a finding only for manipulations of perceptions or psychological states. For a field intervention (a training program, a pay change) or an encouragement (an offer or an invitation), ask for treatment fidelity or take-up instead, and cite E4."
    - text: "In CHECK 5 and CHECK 14, leave comparison with benchmarks from outside the paper to the core face-validity agent; keep whether sizes are reported with each focal test and discussed (E5) and the small-sample warning in CHECK 5. In CHECK 14, a paper that reports an effect size with each focal test but does not discuss its magnitude is Low."
    - text: "In CHECK 9, read `evidence_kind` for each mediation row of `{WORKSPACE}/stage-1/hypothesis_ledger.json` as the list of mediation claims to check; if the file is missing, work as before. Also flag full mediation claimed because the direct effect lost significance; a non-significant direct effect is not evidence of none (checklist item E13)."
  packs/experiments/agents/alternative-explanations.md:
    - text: "Add a line '- **Checklist item:** <id>' to each alternative: E11 for a Category A alternative, E12 for a Category B alternative, and 'none' for the others."
  packs/experiments/agents/cross-study-consistency.md:
    - text: "Apply this note only when `nonlinear` is in `run.json` `overlays`. Leave a claim that an effect differs across conditions or groups within one study to the nonlinear pack when the comparison is listed under `Nonlinear terms:` in `{WORKSPACE}/stage-0/fingerprint.md`; keep every comparison across studies."
    - text: "The core hypothesis ledger checks null-hypothesis framing on every run (its HL7). Skip 'Hypothesis framing consistency (mandatory check)' and leave its row out of your table. Read the difference rows of `{WORKSPACE}/stage-1/hypothesis_ledger.json` as comparisons to check; if the file is missing, work as before. When `nonlinear` is in `run.json` `packs`, leave the ledger's difference rows within one study to the nonlinear pack, whether or not they are listed under `Nonlinear terms:`; keep comparisons across studies."
