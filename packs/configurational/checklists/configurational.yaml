- {id: B1, text: "Every set in the analysis, the outcome and each condition (and any negated set the paper calibrates on its own), has a stated definition, raw measure, and source, and its calibration anchors: full membership, crossover, and full non-membership for a fuzzy set, or the cut points for a crisp or multi-value set.", adjudication: paper}
- {id: B2, text: "Each anchor comes with a stated reason: an external standard, theoretical or case knowledge, the labels of a survey scale, a break in the distribution, or prior practice. Anchors set at sample percentiles pass when the paper says why; they fail when applied by default with no reason, and especially when the paper cites an external standard for that set and does not use it.", adjudication: paper}
- {id: B3, text: "No case has a membership score of exactly 0.5 in any set, or the paper says how such cases were handled; the number of cases in the truth table equals the number the analysis uses, or the paper accounts for the difference.", adjudication: paper}
- {id: B4, text: "The distribution of membership in each set, and in the outcome set especially, is reported (for example, the share of cases above 0.5), and where membership is skewed the paper says how that bears on its consistency and coverage figures.", adjudication: judgment}
- {id: B5, text: "The number of logically possible configurations (2^k for k crisp or fuzzy conditions; the product of the category counts for multi-value conditions) and the share of them with no cases are reported, and the paper defends the number of conditions relative to the number of cases.", adjudication: paper}
- {id: B6, text: "The truth table is reported, in the paper or a supplement, with each row's case count, raw consistency, and, for fuzzy sets, PRI; the raw consistency cutoff, the PRI cutoff for fuzzy sets, and the frequency cutoff are stated, with the share of cases the frequency cutoff keeps. No row or configuration the paper keeps has PRI below 0.50.", adjudication: paper}
- {id: B7, text: "The fit figures cohere: each configuration's unique coverage is at most its raw coverage; solution coverage is at least the largest raw coverage and at most the sum of raw coverages; unique coverages sum to at most solution coverage; each row's and configuration's PRI is at most its raw consistency; the frequency cutoff times the number of rows kept does not exceed the number of cases; and where the paper prints membership scores, the figures recomputed from them are consistent with the reported ones.", adjudication: paper}
- {id: B8, text: "Necessity is tested as its own step, for the outcome (and for its negation when the paper analyzes it), with consistency and coverage for each condition and a stated threshold. A condition called necessary passes that test, and its relevance is addressed (coverage or relevance of necessity). No condition is called necessary because it appears in every sufficient configuration. The order in which the paper presents necessity and sufficiency is never a finding by itself.", adjudication: paper}
- {id: B9, text: "The paper says which solution it interprets (conservative, intermediate, or parsimonious) and why; for an intermediate solution it lists the directional expectations; when it marks core and peripheral conditions it says how they were derived; and it excludes or discusses assumptions about logical remainders that contradict its own necessity results or are otherwise untenable.", adjudication: paper}
- {id: B10, text: "The software and its version are named, and the paper says whether more than one model fits the truth table equally well and, if so, which it reports and why.", adjudication: paper}
- {id: B11, text: "The presence and the absence of the outcome are analyzed separately, or the paper says why only one is; no claim about the absence of the outcome is derived by negating the solution for its presence.", adjudication: paper}
- {id: B12, text: "Claims from the QCA are stated in set-theoretic terms, as configurations that are sufficient or conditions that are necessary. QCA output is not read as the net effect of a single condition, is not described with significance or \"X increases Y\" language, and does not by itself support a hypothesis stated as a correlation or net effect; a condition that appears in some configurations is not described as mattering in all; and a configuration with low raw coverage is not described as the typical or main route to the outcome, nor coverage as variance explained.", adjudication: paper}
- {id: B13, text: "Robustness is reported for the calibration anchors (at least the crossover), the consistency and PRI cutoffs, and the frequency cutoff, saying what changed and which configurations survive.", adjudication: paper}
- {id: B14, text: "Solutions are linked back to cases: typical cases for each configuration are named or described (small N), or the cases each configuration covers are compared (large N), and cases that contradict a sufficient configuration are acknowledged.", adjudication: judgment}
- {id: B15, text: "Claims about sequence, dynamics, or change over time rest on a temporal approach (temporal QCA, separate analyses by period, trajectory-based QCA, or pooled, between, and within consistency for a panel) or are scoped to cross-sectional configurations; a pooled panel of firm-years says whether consistency holds within and between units.", adjudication: judgment}
