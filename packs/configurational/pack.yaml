name: configurational
overlay: true
detection_cues:
  - "qualitative comparative analysis, QCA, fsQCA, csQCA, mvQCA, fuzzy-set, crisp-set, multi-value, set-theoretic, configurational comparative, TQCA"
  - "fs/QCA, fsQCA 3.0, Tosmana, R package QCA, SetMethods, QCApro"
  - "calibration, direct method, full membership, full non-membership, crossover point, set membership"
  - "truth table, logical remainders, limited diversity, consistency threshold, frequency threshold, PRI, proportional reduction in inconsistency"
  - "raw coverage, unique coverage, solution consistency, solution coverage"
  - "necessary condition, sufficient configuration, parsimonious solution, intermediate solution, complex or conservative solution, easy counterfactuals, directional expectations"
  - "core conditions, peripheral or contributing conditions, equifinality, causal asymmetry, conjunctural causation, INUS"
  - "a configuration chart with filled and crossed circles in two sizes; a calibration table with three anchor columns; a truth table with 0/1 columns and number and consistency columns; solution formulas with \"*\" for and and \"~\" for not"
slots:
  verify: [qca-numbers.md]
  diagnose: [qca-calibration.md, qca-analysis.md, qca-interpretation.md]
turns_off: []
core_notes:
  face-validity.md:
    - {text: "Consistency, coverage, PRI, and membership scores from a qualitative comparative analysis are not effect estimates: do not catalog or benchmark them in Steps 1 to 6. In Step 7, unless another pack's note tells you to skip Step 7, assess the raw measure behind each set calibrated by rule from a measured variable as you would any measure; whether the calibration anchors fit the set's definition belongs to the configurational pack (B1, B2). If the paper reports no other estimate, write 'No estimates to benchmark.' for Steps 1 to 6."}
  completeness.md:
    - {text: "For a qualitative comparative analysis, the standard components (calibration table, truth table and thresholds, necessity analysis, robustness to anchors and thresholds) are the configurational pack's checks; do not list them under Step 3, and do not ask for a robustness check that varies a core assumption of the QCA."}
  construction-ledger-producer.md:
    - {text: "For a qualitative comparative analysis, record each condition set with role `treatment` and each outcome set with role `DV`; put the raw measure and the calibration anchors, as the paper gives them, in `construction_formula`, and start `construction_caveats` with 'QCA set'. Write 'not stated' for anchors the paper does not give; do not judge them, since the configurational pack does. Record each set once, as a variable, and not also under `constructs`."}
  theory-logic.md:
    - {text: "When a hypothesis states a net effect or a correlation and the paper tests it only with a qualitative comparative analysis, leave that mismatch to the configurational pack (B12); critique the argument itself."}
  stage-4-compiler:
    - {text: "Findings under the configurational pack's B5 (conditions relative to cases) and B14 (configurations linked to cases) are not demands for statistical generalizability or a sample-size justification; the qualitative pack's fourth severity rule does not remove them. When a core or type-pack source and a configurational agent raise the same problem about the same set, configuration, or QCA table, write one issue under the configurational check id with the severity the configurational rules set. Archival severity rule 1 does not apply to an alternative explanation of a QCA configuration. Such a finding is 'Weakens a claim', and 'Undermines the main claim' only when the headline result or a numbered hypothesis states that the configuration causes the outcome and the paper gives no argument about direction or confounding."}
  stress-test-prompt:
    - {text: "For a qualitative comparative analysis, do not ask for standard errors, p-values, significance tests, effect sizes, or statistical power for consistency, coverage, or a solution; they are not estimates. Asking whether the number of conditions suits the number of cases, or whether configurations hold in named cases, is fair."}
  packs/qualitative/agents/methods-checks.md:
    - {text: "When the findings rest on a qualitative comparative analysis, the configurational pack checks the QCA itself: calibration, the truth table and its thresholds, necessity, logical remainders, fit, robustness, and whether solutions are linked back to cases (B1 to B15). Under CHECK 1, do not assess QCA as a named approach; check only the case, interview, or document work that produced the case evidence. Under CHECK 2, the logic of case selection stays yours (Q7, Q10); the number of conditions relative to cases is B5. Under CHECK 7, cases that contradict a sufficient configuration are B14."}
  packs/qualitative/agents/grounding-audit.md:
    - {text: "When the findings are QCA solutions, treat each set (the outcome and each condition) as a construct and rate how the case evidence grounds its definition and the memberships assigned. Do not enter a configuration's sufficiency or a condition's necessity in the Relationship Ledger; the configurational pack checks those from the truth table (B6 to B9, B12). Enter as a relationship only a claim about why conditions combine or how they work together in the cases."}
  packs/qualitative/agents/claim-to-excerpt.md:
    - {text: "A QCA configuration that no case description supports is B14, which the configurational pack owns; do not raise it under Q4. Check only the excerpts the paper quotes against the claims they are attached to."}
  packs/qualitative/agents/alternative-interpretations.md:
    - {text: "Rival readings that come from the QCA procedure itself (calibration choices, skewed membership, assumptions about logical remainders, another model fitting the same truth table) belong to the configurational pack. Generate rivals about the cases and the evidence."}
  packs/archival/agents/methods-checks.md:
    - {text: "For results from a qualitative comparative analysis (a truth table, consistency and coverage, a solution formula, or a configuration chart), leave to the configurational pack, which runs with you: CHECK 3, since QCA conditions are not controls; CHECK 6 and CHECK 7, since power, precision, and multiple testing do not apply to QCA solutions; CHECK 10 for consistency, coverage, and PRI, which are not effect sizes; and the calibration of raw measures into sets. CHECK 1 (a condition defined from the outcome), CHECK 4, CHECK 4b, and CHECK 8 apply to the QCA's sample and sets as to any analysis, and every check applies to regression estimates the paper also reports."}
  packs/archival/agents/adversarial-dgp.md:
    - {text: "For a finding from a qualitative comparative analysis, alternatives about confounding, selection, or reverse causality are yours. In Step 4, do not treat consistency or coverage as the size of an effect; say whether the alternative could produce the configuration's consistency by itself. Artifacts of the QCA procedure (calibration, skew, remainders) belong to the configurational pack."}
  packs/archival/agents/triangulation.md:
    - {text: "Leave to the configurational pack whether the QCA's fit figures agree with one another (B7) and whether claims about the absence of the outcome follow from the analysis of its presence (B11). Checking that the QCA and any regression the paper reports tell a consistent story stays yours."}
  packs/survey/agents/claims-and-controls.md:
    - {text: "For results from a qualitative comparative analysis, leave causal or net-effect wording about configurations to the configurational pack (B12), and do not treat QCA conditions as controls under S16 or S17. S14 to S17 apply as usual to any regression the paper also reports."}
read_checkin_lines: ["Configurational analysis:"]
severity_rules:
  - "When `Configurational analysis:` has role main, a finding is 'Undermines the main claim' in these cases only. (a) B8: a condition that a numbered hypothesis or the headline result states is necessary has no necessity test in the paper, or the paper's own necessity consistency for it is below the threshold the paper itself states. (b) B6 or B7: the configuration that the headline result or a numbered hypothesis rests on has a reported PRI below 0.50; or its PRI recomputed from printed membership scores is below 0.50, or its recomputed raw consistency is below 0.75, while the reported figure is at or above that value, with both judged by the rounding interval the script uses. The 0.50 PRI floor is from Greckhamer et al. (2018) and Mattke et al. (2022); the 0.75 consistency floor is Ragin's (2008) minimum as cited in Fiss (2011); treating a headline configuration below either as 'Undermines the main claim' is this pack's rule."
  - "Any other finding on an analysis with role main is at most 'Weakens a claim'. In particular: a condition called necessary whose necessity consistency is below the 0.90 convention, when the paper states no threshold of its own, is 'Weakens a claim'; any other recomputed mismatch on a headline figure is 'Weakens a claim'. A finding that only notes a missing report is 'Minor', and is written once per check. Missing reports are: software and version; model ambiguity; the share of logical remainders; the distribution of memberships; the truth table when the three thresholds and the fit of each configuration are stated; necessity figures for negated conditions; an analysis of the outcome's absence when the paper makes no claim about the absence; robustness that covers some but not all of the anchors, the consistency and PRI cutoffs, and the frequency cutoff; case linkage for memberships calibrated from records; the share of cases the frequency cutoff keeps; necessity figures for the outcome's absence; a reason for rows coded 0 at or above every stated cutoff; and which definition a stated share of logical remainders uses."
  - "When `Configurational analysis:` has role secondary, every finding is 'Minor', except that a B7 flag, or a configuration the paper keeps with PRI below 0.50, is 'Weakens a claim'."
  - "B4, B5, and B13 findings are never above 'Weakens a claim'. None of them turns on a numeric threshold for skew, for the ratio of conditions to cases, or for how much a solution may change; a solution that changes under other anchors or thresholds is expected, and a B13 finding is about what the paper reports."
  - "B10 findings are always 'Minor'."
  - "B15 is 'Weakens a claim' when the headline result or a numbered hypothesis claims an order in time; otherwise it is 'Minor'."
