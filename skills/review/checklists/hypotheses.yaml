- {id: HL1, text: "Every stated hypothesis is tested: the paper names a table, column, and term, a reported test statistic, or a figure it presents as the test, and says so when a hypothesis is left untested, with a reason", adjudication: paper}
- {id: HL2, text: "Every result the paper presents in its abstract or conclusion as evidence for its theory maps to a stated hypothesis, or is labeled exploratory or post hoc", adjudication: judgment}
- {id: HL3, text: "The verdict the paper gives each hypothesis (supported, marginally supported, partially supported, not supported) agrees with the estimate of its focal test under the paper's own stated criterion (significance level and tails), or, where the paper states none, under the thresholds its table notes use", adjudication: paper}
- {id: HL4, text: "A hypothesis called partially supported names which part held and which did not, and the part that held rests on the test the paper designates for the hypothesis", adjudication: paper}
- {id: HL5, text: "The sign of each focal test estimate matches the direction the hypothesis predicts on the scale the model estimates (once reverse-coded, rank, hazard, or time-to-event outcomes are accounted for), and no hypothesis is called supported by an estimate of the opposite sign or by a one-tailed p-value for an estimate in the wrong direction", adjudication: paper}
- {id: HL7, text: "A hypothesis framed as a null (no relationship or no difference, in either direction) is judged by that framing with a two-sided test: when its test does not reject, the paper calls it supported, and when its test rejects, not supported", adjudication: paper}
- {id: HL8, text: "A hypothesis that an effect differs across groups, periods, or conditions rests on a test of the difference (a pooled interaction or a test of equal coefficients), not on one estimate being significant and the other not", adjudication: paper}
- {id: HL9, text: "An interaction hypothesis is supported by its product term, estimated in a model that includes the product term, and the product term's sign fits the shape the hypothesis states (strengthens, weakens, reverses) given the sign of the effect it moderates; support is not drawn from the moderator's own coefficient or from a model without the product term", adjudication: paper}
- {id: HL10, text: "A U-shaped or inverted-U hypothesis is not called supported on the sign and significance of a squared term alone: the paper reports where the turning point lies against the observed range and the slopes at both ends, or an equivalent test (two lines, or the Lind and Mehlum test); a diminishing-returns hypothesis needs only the slope at the far end", adjudication: paper}
- {id: HL11, text: "A mediation hypothesis is supported by an estimate of the indirect effect with an interval, not by the causal-steps sequence alone; full mediation is not claimed because the direct effect lost significance; and a moderated-mediation hypothesis rests on an index of moderated mediation or an equivalent test, not on an indirect effect significant at one moderator value and not at another", adjudication: paper}
- {id: HL12, text: "Each hypothesis has the same number, direction, and constructs wherever the paper states or restates it (abstract, introduction, theory section, results, tables, discussion), and the numbering has no unexplained gaps; a paraphrase is not a finding", adjudication: paper}
- {id: HL13, text: "A hypothesis first stated after the results it concerns, or introduced by an unexpected finding, is labeled post hoc and kept apart from the a priori hypotheses in the abstract and conclusions", adjudication: paper}
- {id: HL14, text: "The constructs a hypothesis names match the variables its test uses: the model's outcome is the hypothesis's outcome and its predictor the hypothesis's predictor, at the level the hypothesis states, or the paper states the link between them", adjudication: judgment}
- {id: HL15, text: "When the paper designates one test of a hypothesis (a full model, a primary outcome, a stated column), its verdict rests on that test, and a verdict of support across specifications holds for the specifications the paper names", adjudication: paper}
